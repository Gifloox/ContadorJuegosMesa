<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de Juego · Anotador</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --felt-dark: #0f2e22;
        --felt: #164a34;
        --felt-light: #1f5c40;
        --parchment: #faf4e6;
        --parchment-dim: #f0e6d0;
        --card-border: #ddc98f;
        --ink: #20241c;
        --ink-soft: #5a5a4d;
        --gold: #c89b3c;
        --gold-dark: #9c7728;
        --red: #a1352f;
        --green-ok: #2d6a4f;
        --radius: 18px;
        --shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        color: var(--ink);
        background: radial-gradient(
          ellipse at 50% -10%,
          var(--felt-light) 0%,
          var(--felt) 45%,
          var(--felt-dark) 100%
        );
        background-attachment: fixed;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px 60px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.04) 0,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(255, 255, 255, 0.03) 0,
            transparent 45%
          );
        pointer-events: none;
      }

      #app {
        width: 100%;
        max-width: 560px;
        animation: fadeIn 0.4s ease;
        position: relative;
        z-index: 1;
      }
      #app.wide-mode {
        max-width: 900px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        background: var(--parchment);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 32px 28px 28px;
        position: relative;
      }
      .card.wide {
        padding: 28px 20px;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        border: 1px dashed rgba(200, 155, 60, 0.35);
        border-radius: calc(var(--radius) - 6px);
        pointer-events: none;
      }

      h1,
      h2,
      h3 {
        font-family: "Fraunces", serif;
        color: var(--ink);
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        text-align: center;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      h3 {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--ink-soft);
        margin-top: 22px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-family: "Inter", sans-serif;
      }

      .subtitle {
        text-align: center;
        color: var(--ink-soft);
        margin: 0 0 26px;
        font-size: 0.95rem;
      }

      .btn {
        display: block;
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          opacity 0.12s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }
      .btn-primary {
        background: linear-gradient(
          180deg,
          var(--gold) 0%,
          var(--gold-dark) 100%
        );
        color: #2a1f08;
        margin-top: 18px;
        box-shadow: 0 8px 18px -8px rgba(200, 155, 60, 0.6);
      }
      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 10px 22px -6px rgba(200, 155, 60, 0.75);
      }
      .btn-secondary {
        background: var(--felt);
        color: var(--parchment);
      }
      .btn-link {
        display: block;
        width: 100%;
        text-align: center;
        background: none;
        border: none;
        color: var(--ink-soft);
        font-size: 0.9rem;
        margin-top: 18px;
        cursor: pointer;
        text-decoration: underline;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(42, 31, 8, 0.3);
        border-top-color: #2a1f08;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .divider {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.85rem;
        margin: 20px 0;
        position: relative;
      }
      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 38%;
        height: 1px;
        background: var(--card-border);
      }
      .divider::before {
        left: 0;
      }
      .divider::after {
        right: 0;
      }

      .join-row {
        display: flex;
        gap: 8px;
      }
      .join-row input {
        flex: 1;
        min-width: 0;
      }

      input[type="text"],
      input[type="number"],
      input.name-input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--card-border);
        background: #fff;
        font-family: "Inter", sans-serif;
        font-size: 1rem;
        color: var(--ink);
        margin-bottom: 10px;
      }
      input:focus {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
        border-color: var(--gold);
      }

      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        margin: 16px 0 8px;
      }

      .error {
        color: var(--red);
        font-size: 0.85rem;
        margin-top: 8px;
        min-height: 1em;
      }

      .room-code-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--felt-dark);
        color: var(--parchment);
        font-family: "Space Mono", monospace;
        font-size: 0.85rem;
        padding: 8px 14px;
        border-radius: 999px;
        width: fit-content;
        margin: 0 auto 20px;
        letter-spacing: 0.08em;
      }
      .room-code-badge b {
        color: var(--gold);
        font-size: 1rem;
      }
      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        color: inherit;
        padding: 0 2px;
      }

      .game-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 18px;
      }
      .game-btn {
        padding: 20px;
        border-radius: 14px;
        border: 1.5px solid var(--card-border);
        background: #fff;
        font-family: "Fraunces", serif;
        font-size: 1.15rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.12s ease;
      }
      .game-btn:hover {
        border-color: var(--gold);
        transform: translateY(-2px);
      }

      .mode-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mode-btn {
        padding: 12px 16px;
        border-radius: 10px;
        border: 1.5px solid var(--card-border);
        background: #fff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }
      .mode-btn.active {
        border-color: var(--gold);
        background: #fff8e8;
        box-shadow: 0 0 0 1px var(--gold);
      }

      .names-section {
        margin-top: 12px;
      }

      .count-stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 10px 0 6px;
      }
      .btn-round {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid var(--card-border);
        background: #fff;
        font-size: 1.3rem;
        cursor: pointer;
        line-height: 1;
      }
      .count-display {
        font-family: "Space Mono", monospace;
        font-size: 1.6rem;
        font-weight: 700;
        min-width: 2ch;
        text-align: center;
      }

      .totals-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .total-card {
        background: var(--felt-dark);
        color: var(--parchment);
        border-radius: 12px;
        padding: 14px 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: background-color 0.3s;
      }
      .total-card.winner {
        background: linear-gradient(
          180deg,
          var(--gold) 0%,
          var(--gold-dark) 100%
        );
        color: #2a1f08;
      }
      .total-card.winner .entity-diff {
        color: #2a1f08;
        opacity: 0.7;
      }
      .total-card.eliminated {
        background: #3b1d1d;
      }
      .total-card.eliminated .entity-total {
        color: #ff8a80;
      }

      .entity-name {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.85;
        margin-bottom: 4px;
      }
      .entity-total {
        font-family: "Space Mono", monospace;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .entity-diff {
        font-size: 0.8rem;
        color: var(--gold);
        margin-top: 6px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
      }
      .entity-diff.leader {
        color: rgba(255, 255, 255, 0.5);
      }

      .limit-info {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.85rem;
        margin-top: -4px;
      }

      .turn-banner {
        background: rgba(200, 155, 60, 0.15);
        border: 1px solid var(--gold);
        color: var(--ink);
        text-align: center;
        padding: 10px;
        border-radius: 10px;
        margin: 14px 0 0;
        font-size: 0.95rem;
      }
      .turn-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--felt-dark);
        color: var(--parchment);
        padding: 10px 16px;
        border-radius: 12px;
        margin: 14px 0 0;
      }
      .turn-controls .btn-icon {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .turn-controls .btn-icon:hover {
        background: rgba(255, 255, 255, 0.3);
        color: white;
      }
      .winner-banner {
        background: linear-gradient(
          180deg,
          var(--gold) 0%,
          var(--gold-dark) 100%
        );
        color: #2a1f08;
        text-align: center;
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 1.1rem;
        padding: 12px;
        border-radius: 12px;
        margin: 14px 0;
      }

      .add-hand-section {
        margin-top: 8px;
      }
      .hand-input-group {
        display: grid;
        grid-template-columns: 1fr 90px 90px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .hand-input-group label {
        margin: 0;
        text-transform: none;
        font-weight: 600;
        color: var(--ink);
        font-size: 0.9rem;
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hand-input-group input {
        margin-bottom: 0;
        padding: 10px;
        font-family: "Space Mono", monospace;
        text-align: center;
      }

      .table-scroll {
        overflow-x: auto;
        margin-top: 6px;
        -webkit-overflow-scrolling: touch;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 420px;
        font-size: 0.88rem;
      }
      table th,
      table td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--card-border);
        text-align: center;
        white-space: nowrap;
        transition:
          background-color 0.2s,
          opacity 0.2s;
      }
      table th {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        color: var(--ink-soft);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 2px solid var(--gold);
      }
      table td:first-child,
      table th:first-child {
        text-align: left;
        font-weight: 600;
        position: sticky;
        left: 0;
        background: var(--parchment);
      }
      table.scorecard td:first-child {
        min-width: 130px;
      }

      /* Clase para bloquear visualmente los casilleros en la Generala */
      table td.locked-col {
        background: rgba(0, 0, 0, 0.04);
        opacity: 0.5;
      }
      table th.locked-col {
        opacity: 0.5;
      }
      table td.locked-col input {
        background: transparent;
        border-color: transparent;
        color: rgba(0, 0, 0, 0.5);
      }

      .muted {
        color: var(--ink-soft);
        font-size: 0.78rem;
      }

      table td .cell-input {
        width: 56px;
        padding: 6px 4px;
        margin: 0;
        text-align: center;
        font-family: "Space Mono", monospace;
        transition: all 0.2s ease;
      }
      table td .cell-input.filled {
        background-color: rgba(200, 155, 60, 0.2);
        border-color: var(--gold);
        font-weight: 700;
        color: var(--ink);
      }

      .total-row td {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 1rem;
        border-top: 2px solid var(--gold);
        border-bottom: none;
        background: #fff8e8;
      }
      .total-row td:first-child {
        background: #fff8e8;
      }

      .history-cell {
        padding: 10px 8px;
        line-height: 1.3;
      }

      @media (max-width: 480px) {
        .card {
          padding: 24px 18px 22px;
        }
        h1 {
          font-size: 1.6rem;
        }
      }

      .footer-credits {
        position: fixed;
        bottom: 16px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.4);
        pointer-events: none;
        font-family: "Inter", sans-serif;
        letter-spacing: 0.05em;
        z-index: 9999;
      }
    </style>

  <body>
    <div id="app"></div>
    <div class="footer-credits">
      Desarrollado por Martín Gelvan y Guido Gelvan
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      /* ---------- Estado ---------- */
      let state = {
        code: null,
        room: null,
        screen: "home",
        pollTimer: null,
      };

      // Controla cuál fue el único casillero modificado en este turno (Generala)
      window.currentTurnActiveCat = null;

      const app = document.getElementById("app");

      const NUMBER_CATS = [
        { key: "uno", label: "1 · Ases", n: 1 },
        { key: "dos", label: "2 · Doses", n: 2 },
        { key: "tres", label: "3 · Treses", n: 3 },
        { key: "cuatro", label: "4 · Cuatros", n: 4 },
        { key: "cinco", label: "5 · Cincos", n: 5 },
        { key: "seis", label: "6 · Seises", n: 6 },
      ];
      const POINT_CATS = [
        { key: "escalera", label: "Escalera", hint: "20/25" },
        { key: "full", label: "Full", hint: "30/35" },
        { key: "poker", label: "Póker", hint: "40/45" },
        { key: "generala", label: "Generala", hint: "50/55" },
        { key: "generalaDoble", label: "Gen. Doble", hint: "100/105" },
      ];

      /* ---------- Configuración de Firebase ---------- */
      const firebaseConfig = {
        apiKey: "AIzaSyAcj-EIGLk9nRgcz3KtK4BsCbuwzaGOjI0",
        authDomain: "contador-juegos-de-mesa.firebaseapp.com",
        projectId: "contador-juegos-de-mesa",
        storageBucket: "contador-juegos-de-mesa.firebasestorage.app",
        messagingSenderId: "832032047656",
        appId: "1:832032047656:web:82ac9b1fb22ac35bbc2b1d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      /* ---------- Storage helpers ---------- */
      function genCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let s = "";
        for (let i = 0; i < 5; i++)
          s += chars[Math.floor(Math.random() * chars.length)];
        return s;
      }

      async function saveRoom() {
        if (!state.code || !state.room) return;
        try {
          await db.collection("rooms").doc(state.code).set(state.room);
        } catch (e) {
          console.error("Error guardando sala en Firebase", e);
        }
      }

      async function loadRoom(code) {
        try {
          const docRef = await db.collection("rooms").doc(code).get();
          if (docRef.exists) {
            return docRef.data();
          } else {
            return null;
          }
        } catch (e) {
          console.error("Error cargando sala desde Firebase", e);
          return null;
        }
      }

      function syncUrl() {
        try {
          if (state.code) history.replaceState(null, "", "?room=" + state.code);
          else history.replaceState(null, "", location.pathname);
        } catch (e) {}
      }

      /* ---------- Navegación ---------- */
      function routeToScreen() {
        const r = state.room;
        if (!r || !r.game) {
          state.screen = "choose-game";
          return;
        }
        if (r.game === "burako") {
          state.screen = r.status === "setup" ? "burako-setup" : "burako-play";
        } else if (r.game === "generala") {
          state.screen =
            r.status === "setup" ? "generala-setup" : "generala-play";
        } else if (r.game === "chinchon") {
          state.screen =
            r.status === "setup" ? "chinchon-setup" : "chinchon-play";
        } else if (r.game === "truco") {
          state.screen = r.status === "setup" ? "truco-setup" : "truco-play";
        }
      }

      function goHome() {
        stopPolling();
        state = { code: null, room: null, screen: "home", pollTimer: null };
        window.currentTurnActiveCat = null;
        syncUrl();
        render();
      }

      function startPolling() {
        stopPolling();
        state.pollTimer = setInterval(async () => {
          if (!state.code) return;
          const active = document.activeElement;
          if (active && active.tagName === "INPUT") return;
          const fresh = await loadRoom(state.code);
          if (fresh) {
            state.room = fresh;
            routeToScreen();
            render();
          }
        }, 4000);
      }
      function stopPolling() {
        if (state.pollTimer) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
        }
      }

      function copyCode() {
        const text = state.code;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      }

      /* ---------- Fósforos para Truco ---------- */
      function getMatchBoxSvg(count) {
        const activeColor = "#d6985c";
        const headColor = "#d93829";
        const idleColor = "rgba(0,0,0,0.06)";

        const lines = [
          { x1: 12, y1: 10, x2: 12, y2: 40, hx: 12, hy: 10 },
          { x1: 12, y1: 40, x2: 40, y2: 40, hx: 40, hy: 40 },
          { x1: 40, y1: 40, x2: 40, y2: 10, hx: 40, hy: 10 },
          { x1: 40, y1: 10, x2: 12, y2: 10, hx: 15, hy: 10 },
          { x1: 12, y1: 10, x2: 40, y2: 40, hx: 37, hy: 37 },
        ];

        let svg = `<svg width="52" height="52" viewBox="0 0 52 52">`;
        for (let i = 0; i < 5; i++) {
          const isActive = i < count;
          const color = isActive ? activeColor : idleColor;
          const width = isActive ? 4 : 2;
          svg += `<line x1="${lines[i].x1}" y1="${lines[i].y1}" x2="${lines[i].x2}" y2="${lines[i].y2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" />`;
          if (isActive) {
            svg += `<circle cx="${lines[i].hx}" cy="${lines[i].hy}" r="3" fill="${headColor}" />`;
          }
        }
        svg += `</svg>`;
        return svg;
      }

      function renderTrucoScoreVisual(score, limit) {
        let html =
          '<div style="display:flex; flex-direction:column; gap:16px; align-items:center; min-height: 160px;">';

        const renderSection = (title, start, end) => {
          let sectionHtml = `<div style="text-align:center; width: 100%;">
            <div style="font-size:0.75rem; color:var(--ink-soft); text-transform:uppercase; font-weight:700; margin-bottom:6px; letter-spacing:0.05em;">${title}</div>
            <div style="display:flex; gap:6px; justify-content:center;">`;
          for (let i = start; i < end; i += 5) {
            const boxScore = Math.max(0, Math.min(5, score - i));
            sectionHtml += getMatchBoxSvg(boxScore);
          }
          sectionHtml += "</div></div>";
          return sectionHtml;
        };

        if (limit === 30) {
          html += renderSection("Malas", 0, 15);
          html += renderSection("Buenas", 15, 30);
        } else {
          html += renderSection("Puntos", 0, limit);
        }

        html += "</div>";
        return html;
      }

        const entity = t.entities.find((e) => e.id === entityId);
        if (entity) {
          entity.score = Math.max(0, Math.min(t.limit, entity.score + delta));
          if (t.entities.some((e) => e.score >= t.limit)) {
            state.room.status = "finished";
          }
          await saveRoom();
          render();
        }
      };

        render();

      async function setBurakoMode(mode) {

      async function startBurakoGame() {

        if (b.mode === 4) {

            document.getElementById("bname-0")?.value.trim() || "Nosotros";
          b.entities[1].name =

        await saveRoom();
        state.screen = "burako-play";
        render();

      window.checkBurakoInputs = function () {
        const b = state.room.burako;
        let allFilled = true;
        for (const e of b.entities) {
          const baseEl = document.getElementById("base-" + e.id);
          const mesaEl = document.getElementById("mesa-" + e.id);
          if (
            !baseEl ||
            !mesaEl ||
            baseEl.value === "" ||
            mesaEl.value === ""
          ) {
            allFilled = false;
            break;
          }
        }
        const btn = document.getElementById("btn-add-hand");
        if (btn) btn.disabled = !allFilled;
      };

      function computeBurakoTotals() {
        const b = state.room.burako;
        const totals = {};
        b.entities.forEach((e) => (totals[e.id] = 0));
        b.rounds.forEach((r) => {
          b.entities.forEach((e) => {
            totals[e.id] += r.values[e.id] ? r.values[e.id].total : 0;
          });
        });
        return totals;
      }

      function renderBurakoPlay() {
        app.classList.remove("wide-mode");
        const b = state.room.burako;
        const totals = computeBurakoTotals();
        const values = Object.values(totals);
        const maxTotal = values.length ? Math.max(...values) : 0;
        const finished = maxTotal >= b.limit;
        const winners = finished
          ? b.entities.filter((e) => totals[e.id] === maxTotal)
          : [];

        const turnCount = b.mode === 4 ? 4 : b.entities.length;
        const turnIndex = (b.startIndex + b.rounds.length) % turnCount;
        let currentStarterName = "";

        if (b.mode === 4) {
          const teamIndex = turnIndex % 2;
          const pName =
            b.players && b.players[turnIndex]
              ? b.players[turnIndex]
              : "Jugador " + (turnIndex + 1);
          currentStarterName = `${pName} <span style="font-size:0.85rem; font-weight:normal; opacity:0.85">(${b.entities[teamIndex].name})</span>`;
        } else {
          currentStarterName = b.entities[turnIndex].name;
        }

        const totalsCards = b.entities
          .map((e) => {
            const t = totals[e.id];
            const diff = maxTotal - t;
            let diffHtml = "";
            if (maxTotal > 0) {
              if (diff > 0)
                diffHtml = `<div class="entity-diff">a ${diff} pts</div>`;
              else diffHtml = `<div class="entity-diff leader">Líder</div>`;
            }
            return `<div class="total-card ${finished && t === maxTotal ? "winner" : ""}">
            <div class="entity-name">${e.name}</div>
            <div class="entity-total">${t}</div>
            ${diffHtml}
          </div>`;
          })
          .join("");

        const formInputs = b.entities
          .map(
            (e) => `
          <div class="hand-input-group">
            <label>${e.name}</label>
            <input type="number" id="base-${e.id}" placeholder="Base" oninput="checkBurakoInputs()" />
            <input type="number" id="mesa-${e.id}" placeholder="Mesa" oninput="checkBurakoInputs()" />
          </div>
        `,
          )
          .join("");

        let historyRows = "";
        let running = {};
        b.entities.forEach((e) => (running[e.id] = 0));
        b.rounds.forEach((r, idx) => {
          b.entities.forEach((e) => {
            running[e.id] += r.values[e.id] ? r.values[e.id].total : 0;
          });
          historyRows += `<tr><td>Mano ${idx + 1}</td>${b.entities
            .map((e) => {
              const base = r.values[e.id] ? r.values[e.id].base : 0;
              const mesa = r.values[e.id] ? r.values[e.id].mesa : 0;
              const t = r.values[e.id] ? r.values[e.id].total : 0;
              return `<td class="history-cell">
              <div style="font-weight: 700; font-size: 1.05rem; color: ${t < 0 ? "var(--red)" : "var(--ink)"}">${t > 0 ? "+" : ""}${t}</div>
              <div class="muted" style="font-size: 0.7rem;">B: ${base} | M: ${mesa}</div>
              <div style="font-size: 0.8rem; margin-top: 4px; color: var(--gold-dark); font-weight: 600;">∑ ${running[e.id]}</div>
            </td>`;
            })
            .join("")}</tr>`;
        });

        app.innerHTML = `
    <div class="card">
      <div class="room-code-badge">Sala <b>${state.code}</b> <button class="copy-btn" onclick="copyCode()">📋</button></div>
      <h2>🃏 Burako ${finished ? "· Terminado" : ""}</h2>
      <div class="limit-info">Puntaje límite: <b>${b.limit}</b></div>
      
      ${
        finished
          ? `<div class="winner-banner">🏆 Gana ${winners.map((w) => w.name).join(" y ")}</div>`
          : `<div class="turn-banner">Ronda ${b.rounds.length + 1} · Reparte / Empieza: <br><b>${currentStarterName}</b></div>`
      }
      
      <div class="totals-grid">${totalsCards}</div>
      ${
        !finished
          ? `
        <div class="add-hand-section">
          <h3>Agregar mano</h3>
          <div class="hand-input-group" style="opacity:.6">
            <label></label><label style="text-align:center;font-size:.75rem;text-transform:uppercase">Base</label><label style="text-align:center;font-size:.75rem;text-transform:uppercase">Mesa</label>
          </div>
          ${formInputs}
          <button class="btn btn-primary" id="btn-add-hand" onclick="addBurakoHand()" disabled>Guardar mano</button>
        </div>`
          : `
        <button class="btn btn-primary" onclick="restartBurako()">Jugar otra partida (Mismos equipos)</button>
      `
      }
      <h3>Historial de Manos</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th></th>${b.entities.map((e) => `<th>${e.name}</th>`).join("")}</tr></thead>
          <tbody>${historyRows || '<tr><td colspan="' + (b.entities.length + 1) + '" class="muted">Todavía no hay manos jugadas</td></tr>'}</tbody>
        </table>
      </div>
      <button class="btn-link" onclick="goHome()">‹ Salir de la sala</button>
    </div>`;
      }

      async function addBurakoHand() {
        const btn = document.getElementById("btn-add-hand");
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> Guardando...';
        }
        const b = state.room.burako;
        const values = {};
        for (const e of b.entities) {
          const baseEl = document.getElementById("base-" + e.id);
          const mesaEl = document.getElementById("mesa-" + e.id);
          const base = parseInt(baseEl.value) || 0;
          const mesa = parseInt(mesaEl.value) || 0;
          values[e.id] = { base, mesa, total: base + mesa };
        }
        b.rounds.push({ values });
        await saveRoom();
        render();
      }

      async function restartBurako() {
        const b = state.room.burako;
        b.rounds = [];
        const turnCount = b.mode === 4 ? 4 : b.entities.length;
        b.startIndex = (b.startIndex + 1) % turnCount;
        state.room.status = "playing";
        await saveRoom();
        render();

      <div class="room-code-badge">Sala <b>${state.code}</b> <button class="copy-btn" onclick="copyCode()">📋</button></div>

        <button class="btn-round" onclick="changeChinchonCount(1)">+</button>
      </div>
      <div class="names-section">
        <label style="color: var(--ink-soft); font-size: 0.8rem;">Nombres (en orden de juego. El 1° empieza)</label>
        ${namesHtml}
      </div>
      <label>Puntaje límite para perder (ej: 100)</label>
      <input type="number" id="climit" value="${c.limit || 100}" />
      <button class="btn btn-primary" onclick="startChinchonGame()">Comenzar partida</button>
      <button class="btn-link" onclick="goHome()">‹ Salir de la sala</button>
    </div>`;
      }

      async function changeChinchonCount(delta) {
        const c = state.room.chinchon;
        c.entities.forEach((e, i) => {
          const el = document.getElementById("cname-" + i);
          if (el) e.name = el.value;
        });
        let count = Math.max(2, Math.min(8, c.entities.length + delta));
        c.entities = Array.from({ length: count }).map(
          (_, i) => c.entities[i] || { id: "p" + i, name: "" },
        );
        await saveRoom();
        render();
      }

      async function startChinchonGame() {
        const c = state.room.chinchon;
        c.entities.forEach((e, i) => {
          const el = document.getElementById("cname-" + i);
          e.name = (el ? el.value.trim() : "") || "Jugador " + (i + 1);
        });
        const limitVal = parseInt(document.getElementById("climit").value);
        c.limit = isNaN(limitVal) ? 100 : limitVal;
        c.rounds = [];
        c.startIndex = 0;
        state.room.status = "playing";
        await saveRoom();
        state.screen = "chinchon-play";
        render();
      }

      function computeChinchonTotals() {
        const c = state.room.chinchon;
        const totals = {};
        c.entities.forEach((e) => (totals[e.id] = 0));
        c.rounds.forEach((r) => {
          c.entities.forEach((e) => {
            totals[e.id] += r.values[e.id] || 0;
          });
        });
        return totals;
      }

      window.checkChinchonInputs = function () {
        const c = state.room.chinchon;
        let allFilled = true;
        for (const e of c.entities) {
          const ptEl = document.getElementById("cpts-" + e.id);
          if (!ptEl || ptEl.value === "") {
            allFilled = false;
            break;
          }
        }
        const btn = document.getElementById("btn-add-chand");
        if (btn) btn.disabled = !allFilled;
      };

      function renderChinchonPlay() {
        app.classList.remove("wide-mode");
        const c = state.room.chinchon;
        const totals = computeChinchonTotals();
        const finished = state.room.status === "finished";

        const values = Object.values(totals);
        const minTotal = values.length ? Math.min(...values) : 0;
        const winners = finished
          ? c.entities.filter((e) => totals[e.id] === minTotal)
          : [];

        const turnIndex = (c.startIndex + c.rounds.length) % c.entities.length;
        const currentStarterName = c.entities[turnIndex].name;

        const totalsCards = c.entities
          .map((e) => {
            const t = totals[e.id];
            const isEliminated = t >= c.limit;
            let diffHtml = "";

            if (!isEliminated) {
              if (t > minTotal)
                diffHtml = `<div class="entity-diff">a ${t - minTotal} pts</div>`;
              else diffHtml = `<div class="entity-diff leader">Líder</div>`;
            } else {
              diffHtml = `<div class="entity-diff" style="color:#ff8a80">Eliminado</div>`;
            }

            return `<div class="total-card ${isEliminated ? "eliminated" : ""} ${finished && t === minTotal ? "winner" : ""}">
            <div class="entity-name">${e.name}</div>
            <div class="entity-total">${t}</div>
            ${diffHtml}
          </div>`;
          })
          .join("");

        const formInputs = c.entities
          .map(
            (e) => `
          <div class="hand-input-group" style="grid-template-columns: 1fr 120px;">
            <label>${e.name}</label>
            <input type="number" id="cpts-${e.id}" placeholder="Puntos" oninput="checkChinchonInputs()" />
          </div>
        `,
          )
          .join("");

        let historyRows = "";
        let running = {};
        c.entities.forEach((e) => (running[e.id] = 0));
        c.rounds.forEach((r, idx) => {
          c.entities.forEach((e) => {
            running[e.id] += r.values[e.id] || 0;
          });
          historyRows += `<tr><td>Ronda ${idx + 1}</td>${c.entities
            .map((e) => {
              const val = r.values[e.id] || 0;
              return `<td class="history-cell">
              <div style="font-weight: 700; font-size: 1.05rem; color: ${val < 0 ? "var(--green-ok)" : "var(--ink)"}">${val > 0 ? "+" : ""}${val}</div>
              <div style="font-size: 0.8rem; margin-top: 4px; color: var(--gold-dark); font-weight: 600;">∑ ${running[e.id]}</div>
            </td>`;
            })
            .join("")}</tr>`;
        });

        app.innerHTML = `
    <div class="card">
      <div class="room-code-badge">Sala <b>${state.code}</b> <button class="copy-btn" onclick="copyCode()">📋</button></div>
      <h2>🎴 Chin Chon ${finished ? "· Terminado" : ""}</h2>
      <div class="limit-info">Límite para perder: <b>${c.limit}</b></div>
      
      ${
        finished
          ? `<div class="winner-banner">🏆 Gana ${winners.map((w) => w.name).join(" y ")}</div>`
          : `<div class="turn-banner">Ronda ${c.rounds.length + 1} · Reparte: <br><b>${currentStarterName}</b></div>`
      }
      
      <div class="totals-grid">${totalsCards}</div>
      ${
        !finished
          ? `
        <div class="add-hand-section">
          <h3>Puntos de la ronda</h3>
          ${formInputs}
          <button class="btn btn-primary" id="btn-add-chand" onclick="addChinchonHand()" disabled>Guardar mano</button>
        </div>`
          : `
        <button class="btn btn-primary" onclick="restartChinchon()">Jugar otra partida (Mismos jugadores)</button>
      `
      }
      ${!finished && c.rounds.length > 0 ? `<button class="btn btn-secondary" style="margin-top:20px" onclick="finishChinchon()">Finalizar juego manualmente</button>` : ""}
      
      <h3>Historial</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th></th>${c.entities.map((e) => `<th>${e.name}</th>`).join("")}</tr></thead>
          <tbody>${historyRows || '<tr><td colspan="' + (c.entities.length + 1) + '" class="muted">Todavía no hay rondas jugadas</td></tr>'}</tbody>
        </table>
      </div>
      <button class="btn-link" onclick="goHome()">‹ Salir de la sala</button>
    </div>`;
      }

      async function addChinchonHand() {
        const btn = document.getElementById("btn-add-chand");
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> Guardando...';
        }
        const c = state.room.chinchon;
        const values = {};
        for (const e of c.entities) {
          const ptEl = document.getElementById("cpts-" + e.id);
          values[e.id] = parseInt(ptEl.value) || 0;
        }
        c.rounds.push({ values });
        await saveRoom();
        render();
      }

      async function finishChinchon() {
        state.room.status = "finished";
        await saveRoom();
        render();
      }

      async function restartChinchon() {
        const c = state.room.chinchon;
        c.rounds = [];
        c.startIndex = (c.startIndex + 1) % c.entities.length;
        state.room.status = "playing";
        await saveRoom();
        render();
      }

      /* ==================== GENERALA ==================== */
      function renderGeneralaSetup() {
        app.classList.remove("wide-mode");
        const g = state.room.generala;
        if (!g.entities.length) {
          g.entities = [
            { id: "p0", name: "" },
            { id: "p1", name: "" },
          ];
        }
        const count = g.entities.length;
        const namesHtml = g.entities
          .map(
            (e, i) => `
          <input class="name-input" id="gname-${i}" placeholder="${i + 1}° Jugador ${i === 0 ? "(Empieza)" : ""}" value="${e.name || ""}" />
        `,
          )
          .join("");

        app.innerHTML = `
    <div class="card">
      <div class="room-code-badge">Sala <b>${state.code}</b> <button class="copy-btn" onclick="copyCode()">📋</button></div>
      <h2>🎲 Configurar Generala</h2>
      <label style="margin-top:6px">Cantidad de jugadores (2 a 10)</label>
      <div class="count-stepper">
        <button class="btn-round" onclick="changeGeneralaCount(-1)">−</button>
        <span class="count-display">${count}</span>
        <button class="btn-round" onclick="changeGeneralaCount(1)">+</button>
      </div>
      <div class="names-section">
        <label style="color: var(--ink-soft); font-size: 0.8rem;">Nombres (en orden de juego. El 1° empieza)</label>
        ${namesHtml}
      </div>
      <button class="btn btn-primary" onclick="startGeneralaGame()">Comenzar partida</button>
      <button class="btn-link" onclick="goHome()">‹ Salir de la sala</button>
    </div>`;
      }

      async function changeGeneralaCount(delta) {
        const g = state.room.generala;
        g.entities.forEach((e, i) => {
          const el = document.getElementById("gname-" + i);
          if (el) e.name = el.value;
        });
        let count = Math.max(2, Math.min(10, g.entities.length + delta));
        g.entities = Array.from({ length: count }).map(
          (_, i) => g.entities[i] || { id: "p" + i, name: "" },
        );
        await saveRoom();
        render();
      }

      async function startGeneralaGame() {
        const g = state.room.generala;
        g.entities.forEach((e, i) => {
          const el = document.getElementById("gname-" + i);
          e.name = (el ? el.value.trim() : "") || "Jugador " + (i + 1);
        });
        g.scores = {};
        g.entities.forEach((e) => {
          g.scores[e.id] = {
            uno: null,
            dos: null,
            tres: null,
            cuatro: null,
            cinco: null,
            seis: null,
            escalera: null,
            full: null,
            poker: null,
            generala: null,
            generalaDoble: null,
          };
        });
        g.startIndex = 0;
        g.turn = g.startIndex;
        window.currentTurnActiveCat = null;
        state.room.status = "playing";
        await saveRoom();
        state.screen = "generala-play";
        render();
      }

      function computeGeneralaTotal(g, entityId) {
        const s = g.scores[entityId];
        let total = 0;
        Object.values(s).forEach((v) => {
          if (typeof v === "number") total += v;
        });
        return total;
      }

      window.changeGeneralaTurn = async function (delta) {
        const g = state.room.generala;
        const len = g.entities.length;
        g.turn = (g.turn + delta + len) % len;
        window.currentTurnActiveCat = null;
        await saveRoom();
        render();
      };

      window.endGeneralaTurn = async function (e) {
        if (e) e.preventDefault();
        const btn = e ? e.currentTarget : null;
        if (btn) {
          btn.innerHTML = '<span class="spinner"></span> Procesando...';
          btn.style.pointerEvents = "none";
        }
        if (
          document.activeElement &&
          document.activeElement.tagName === "INPUT"
        ) {
          document.activeElement.blur();
          await new Promise((r) => setTimeout(r, 150));
        }
        const g = state.room.generala;
        g.turn = (g.turn + 1) % g.entities.length;
        window.currentTurnActiveCat = null;
        await saveRoom();
        render();
      };

      // Función que fuerza a que el número ingresado sea válido para esa categoría
      function snapToValidGenerala(val, cat) {
        if (val < 0) val = 0;
        let valid = [];
        if (cat === "uno") valid = [0, 1, 2, 3, 4, 5];
        else if (cat === "dos") valid = [0, 2, 4, 6, 8, 10];
        else if (cat === "tres") valid = [0, 3, 6, 9, 12, 15];
        else if (cat === "cuatro") valid = [0, 4, 8, 12, 16, 20];
        else if (cat === "cinco") valid = [0, 5, 10, 15, 20, 25];
        else if (cat === "seis") valid = [0, 6, 12, 18, 24, 30];
        else if (cat === "escalera") valid = [0, 20, 25];
        else if (cat === "full") valid = [0, 30, 35];
        else if (cat === "poker") valid = [0, 40, 45];
        else if (cat === "generala") valid = [0, 50, 55];
        else if (cat === "generalaDoble") valid = [0, 100, 105];

        // Encuentra el numero valido más cercano al ingresado por el usuario
        return valid.reduce((prev, curr) =>
          Math.abs(curr - val) < Math.abs(prev - val) ? curr : prev,
        );
      }

      function renderGeneralaPlay() {
        app.classList.add("wide-mode");
        const g = state.room.generala;
        const finished = state.room.status === "finished";

        const header = `<tr><th>Categoría</th>${g.entities.map((e, i) => `<th class="${i !== g.turn && !finished ? "locked-col" : ""}">${e.name}</th>`).join("")}</tr>`;

        const renderRows = (categories) =>
          categories
            .map((cat) => {
              const cells = g.entities
                .map((e, i) => {
                  const val = g.scores[e.id][cat.key];
                  const isTurn = i === g.turn;
                  const disabled = !isTurn || finished ? "disabled" : "";
                  const isFilled = val !== null && val !== undefined;

                  // Bloquea visualmente los campos vacíos de esta ronda si ya se anotó otro campo
                  const isLockedThisTurn =
                    isTurn &&
                    window.currentTurnActiveCat &&
                    window.currentTurnActiveCat !== cat.key &&
                    !isFilled;
                  const lockedClass =
                    (!isTurn && !finished) || isLockedThisTurn
                      ? "locked-col"
                      : "";

                  const filledClass = isFilled ? "filled" : "";

                  let constraints =
                    'min="0" inputmode="numeric" pattern="[0-9]*"';
                  if (cat.n) {
                    constraints += ` max="${cat.n * 5}" step="${cat.n}"`;
                  } else {
                    let max = 0;
                    if (cat.key === "escalera") max = 25;
                    if (cat.key === "full") max = 35;
                    if (cat.key === "poker") max = 45;
                    if (cat.key === "generala") max = 55;
                    if (cat.key === "generalaDoble") max = 105;
                    constraints += ` max="${max}" step="5"`;
                  }

                  return `<td class="${lockedClass}">
              <input type="number" class="cell-input ${filledClass}" ${disabled} ${constraints}
                data-entity="${e.id}" data-cat="${cat.key}"
                value="${isFilled ? val : ""}" 
                placeholder="${cat.hint || "ej: " + cat.n * 3}"
                onchange="updateGeneralaPointCell(this)" />
            </td>`;
                })
                .join("");
              return `<tr><td>${cat.label}</td>${cells}</tr>`;
            })
            .join("");

        const numberRows = renderRows(NUMBER_CATS);
        const pointRows = renderRows(POINT_CATS);

        const totalRow = `<tr class="total-row"><td>TOTAL</td>${g.entities
          .map((e) => {
            const totalPts = computeGeneralaTotal(g, e.id);
            const filledCount = Object.values(g.scores[e.id]).filter(
              (v) => v !== null,
            ).length;
            return `<td>
            <div>${totalPts}</div>
            <div style="font-size:0.7rem; font-weight:normal; color:var(--ink-soft); margin-top:2px;">${filledCount}/11 listas</div>
          </td>`;
          })
          .join("")}</tr>`;

        const totalsList = g.entities.map((e) => ({
          e,
          total: computeGeneralaTotal(g, e.id),
        }));
        const maxTotal = totalsList.length
          ? Math.max(...totalsList.map((t) => t.total))
          : 0;
        const winners = finished
          ? totalsList.filter((t) => t.total === maxTotal).map((t) => t.e)
          : [];

        app.innerHTML = `
    <div class="card wide">
      <div class="room-code-badge">Sala <b>${state.code}</b> <button class="copy-btn" onclick="copyCode()">📋</button></div>
      <h2 style="text-align:center">🎲 Generala ${finished ? "· Terminado" : ""}</h2>
      
      ${
        finished
          ? `<div class="winner-banner">🏆 Gana ${winners.map((w) => w.name).join(" y ")}</div>`
          : `
        <div class="turn-controls" style="flex-direction: column; gap: 12px; padding: 14px 16px;">
          <div style="display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1.05rem;">
            <button class="btn-icon" onclick="changeGeneralaTurn(-1)" title="Corregir (retroceder)" style="width:28px; height:28px; font-size:1.1rem;">‹</button>
            <div>Turno de: <b style="color: var(--gold);">${g.entities[g.turn].name}</b></div>
            <button class="btn-icon" onclick="changeGeneralaTurn(1)" title="Corregir (avanzar)" style="width:28px; height:28px; font-size:1.1rem;">›</button>
          </div>
          <button class="btn btn-primary" style="margin-top: 0;" onpointerdown="endGeneralaTurn(event)">Terminar turno de ${g.entities[g.turn].name}</button>
        </div>`
      }
      
      <div class="table-scroll">
        <table class="scorecard">
          <thead>${header}</thead>
          <tbody>
            ${numberRows}
            ${pointRows}
            ${totalRow}
          </tbody>
        </table>
      </div>
      ${
        !finished
          ? `<button class="btn btn-secondary" style="margin-top:20px" onclick="finishGenerala()">Finalizar juego manualmente</button>`
          : `<button class="btn btn-primary" onclick="restartGenerala()">Jugar otra partida (Mismos jugadores)</button>`
      }
      <button class="btn-link" onclick="goHome()">‹ Salir de la sala</button>
    </div>`;
      }

      async function updateGeneralaPointCell(input) {
        const entity = input.dataset.entity,
          cat = input.dataset.cat;
        const raw = input.value;
        const val = parseInt(raw);

        const g = state.room.generala;

        // Si previamente habían completado una categoría distinta en este turno, se limpia
        if (
          window.currentTurnActiveCat &&
          window.currentTurnActiveCat !== cat
        ) {
          g.scores[entity][window.currentTurnActiveCat] = null;
        }

        if (raw === "" || isNaN(val)) {
          g.scores[entity][cat] = null;
          if (window.currentTurnActiveCat === cat) {
            window.currentTurnActiveCat = null;
          }
        } else {
          // Ajusta el puntaje al numero valido más cercano
          g.scores[entity][cat] = snapToValidGenerala(val, cat);
          window.currentTurnActiveCat = cat;
        }

        await saveRoom();
        render();
      }

      async function finishGenerala() {
        state.room.status = "finished";
        await saveRoom();
        render();
      }

      async function restartGenerala() {
        const g = state.room.generala;
        g.entities.forEach((e) => {
          g.scores[e.id] = {
            uno: null,
            dos: null,
            tres: null,
            cuatro: null,
            cinco: null,
            seis: null,
            escalera: null,
            full: null,
            poker: null,
            generala: null,
            generalaDoble: null,
          };
        });
        g.startIndex = (g.startIndex + 1) % g.entities.length;
        g.turn = g.startIndex;
        window.currentTurnActiveCat = null;
        state.room.status = "playing";
        await saveRoom();
        render();
      }

      /* ---------- Render dispatcher ---------- */
      function render() {
        const scrollEl = document.querySelector(".table-scroll");
        const savedTableScroll = scrollEl ? scrollEl.scrollLeft : 0;
        const savedWindowScroll =
          window.scrollY || document.documentElement.scrollTop;

        switch (state.screen) {
          case "home":
            renderHome();
            break;
          case "choose-game":
            renderChooseGame();
            break;
          case "truco-setup":
            renderTrucoSetup();
            break;
          case "truco-play":
            renderTrucoPlay();
            break;
          case "burako-setup":
            renderBurakoSetup();
            break;
          case "burako-play":
            renderBurakoPlay();
            break;
          case "generala-setup":
            renderGeneralaSetup();
            break;
          case "generala-play":
            renderGeneralaPlay();
            break;
          case "chinchon-setup":
            renderChinchonSetup();
            break;
          case "chinchon-play":
            renderChinchonPlay();
            break;
          default:
            renderHome();
        }

        const newScrollEl = document.querySelector(".table-scroll");
        if (newScrollEl && savedTableScroll > 0) {
          newScrollEl.scrollLeft = savedTableScroll;
        }
        window.scrollTo(0, savedWindowScroll);
      }

      /* ---------- Inicio ---------- */
      (async function init() {
        const params = new URLSearchParams(location.search);
        const roomParam = params.get("room");
        if (roomParam) {
          const code = roomParam.toUpperCase();
          const room = await loadRoom(code);
          if (room) {
            state.code = code;
            state.room = room;
            routeToScreen();
            startPolling();
          }
        }
        render();
      })();
    </script>
  </body>
</html>
